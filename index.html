<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <div class="header">
                <h1><i class="fas fa-calculator"></i> Basic Calculator</h1>
                <p class="subtitle">Network Security & Cryptography Project</p>
            </div>
            
            <div class="display">
                <div class="previous-operand" id="previous-operand"></div>
                <div class="current-operand" id="current-operand">0</div>
            </div>
            
            <div class="buttons-grid">
                <button class="btn btn-clear span-two" data-action="clear">AC</button>
                <button class="btn btn-delete" data-action="delete">
                    <i class="fas fa-backspace"></i> DEL
                </button>
                <button class="btn btn-operation" data-operation="÷">÷</button>
                
                <button class="btn btn-number" data-number="7">7</button>
                <button class="btn btn-number" data-number="8">8</button>
                <button class="btn btn-number" data-number="9">9</button>
                <button class="btn btn-operation" data-operation="×">×</button>
                
                <button class="btn btn-number" data-number="4">4</button>
                <button class="btn btn-number" data-number="5">5</button>
                <button class="btn btn-number" data-number="6">6</button>
                <button class="btn btn-operation" data-operation="-">-</button>
                
                <button class="btn btn-number" data-number="1">1</button>
                <button class="btn btn-number" data-number="2">2</button>
                <button class="btn btn-number" data-number="3">3</button>
                <button class="btn btn-operation" data-operation="+">+</button>
                
                <button class="btn btn-number span-two" data-number="0">0</button>
                <button class="btn btn-number" data-number=".">.</button>
                <button class="btn btn-equals" data-action="calculate">=</button>
            </div>
            
            <div class="footer">
                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i> Secure Calculation
                </div>
                <p class="info">Supports basic operations: +, -, ×, ÷</p>
            </div>
        </div>
        
        <div class="instructions">
            <h3><i class="fas fa-info-circle"></i> How to Use:</h3>
            <ul>
                <li>Click numbers to input values</li>
                <li>Select an operation (+, -, ×, ÷)</li>
                <li>Press = to calculate result</li>
                <li>AC - Clear all | DEL - Delete last digit</li>
            </ul>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
